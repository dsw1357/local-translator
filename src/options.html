<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로컬 번역 옵션</title>
  <link rel="stylesheet" href="result.css">
  <script type="module" src="options.js"></script>
</head>
<body>
  <main class="options">
    <h1>로컬 번역 옵션</h1>
    <fieldset disabled>
      <legend>번역 표시 방식</legend>
      <label><input type="radio" name="displayMode" value="tab"> 번역 시 새 탭 열기</label>
      <p>번역과 원문을 새 탭에서 확인합니다.</p>
      <label><input type="radio" name="displayMode" value="page" checked> 페이지 내 번역 <small>기본값</small></label>
      <p>현재 페이지의 글을 바꿔 표시합니다. 원문은 번역 도구에서 복원할 수 있습니다.</p>
    </fieldset>
    <p id="status" role="status"></p>
  </main>
</body>
</html>
